name: CI

on:
  pull_request:
    branches: ["v2/**"]
  push:
    branches: ["v2/main"]

# Neither job writes to the repo (L13, Hadi's Claude, 2026-11-22).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The Cloudflare Workers build (vinext; docs/agent/cloudflare.md).
      - run: npm run build:vinext

  # A3 smoke suite (Hadi's Claude, 2026-11-22): Playwright against `next start`, signed out, with
  # CourseDog-backed routes stubbed (e2e/fixtures.ts). No secrets or network services needed.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cache Playwright's Chromium, keyed on the pinned @playwright/test version. On a hit only the
      # system packages are installed (apt isn't cached).
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # NEXT_PUBLIC_* are inlined here, at build time, so this is where Supabase has to be blank.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      - run: npm run e2e -- --trace off
        env:
          E2E_SKIP_BUILD: "1"
      - if: failure()
        run: npx playwright test --trace on --last-failed
        env:
          E2E_SKIP_BUILD: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The same smoke suite against the Cloudflare Worker build (Hadi's Claude, #118): vinext build,
  # catalog loaded into a local D1, served by `wrangler dev`. Local only; no Cloudflare account or token.
  e2e-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:vinext
      - run: npm run export:d1
      - run: npx wrangler d1 execute planumn-catalog --local --persist-to .wrangler/state --file .wrangler/catalog-d1.sql -y
      - name: Start the Worker
        run: |
          npx wrangler dev --config dist/server/wrangler.json --persist-to .wrangler/state --port 8788 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:8788/api/departments && exit 0; sleep 2; done
          cat wrangler-dev.log; exit 1
      - run: npm run e2e -- --trace off
        env:
          E2E_BASE_URL: http://127.0.0.1:8788
      - if: failure()
        run: cat wrangler-dev.log
